      "abstract": "Large language model (LLM) agents are increasingly applied to financial decision-making tasks that require interaction with external tools, including market data retrieval, news analysis, and trade execution. However, existing trading systems rely on fragmented and task-specific APIs, resulting in inconsistent schemas, complex integration, and limited reproducibility. We present QFinZero, a unified trading environment for LLM-based financial agents. QFinZero standardizes three core capabilities: (i) multi-frequency market and derivatives data access, (ii) structured news and event retrieval, and (iii) stateful brokerage simulation with explicit order lifecycle management. All tools adopt consistent JSON schemas and time-aligned interfaces, enabling agents to acquire information and execute trades within a coherent framework. By abstracting financial interaction into composable, agent-invokable primitives, QFinZero reduces engineering overhead and supports reproducible evaluation through comprehensive logging and deterministic replay. We argue that such a standardized trading environment is essential for scalable research on LLM-based financial agents.",

      "abstract": "Formulaic alpha factor mining (FAFM) is a central problem in quantitative investment, where interpretable formulas are designed to extract predictive signals from historical financial series. With the emergence of large language models (LLMs), recent studies have begun to explore their roles in FAFM, yet their capabilities across different tasks and configurations remain unclear. In this work, we introduce AlphaBench, the first systematic benchmark for evaluating LLMs in FAFM. AlphaBench covers three core tasks, including factor generation, factor evaluation, and factor searching, which are all popular tasks integrated in the workflow of quantitative researchers. Beyond task-level evaluation, we further analyze how different LLM settings, including model type, prompting paradigm, and reasoning strategy, influence performance. Our experiments on a range of open-source and closed-source models reveal that LLMs hold strong potential in automating factor mining, while also facing persistent challenges in robustness, search efficiency, and practical usability. The project is available at: https://alphabench.cc/",

      "abstract": "Alpha factor discovery is a central challenge in quantitative finance, traditionally addressed by human experts or automated search methods such as genetic programming and evolutionary algorithms. These approaches often lack semantic guidance, leading to inefficient search and fragile results. We propose a language-model-guided evolutionary framework, where large language models (LLMs) act as intelligent operators to guide mutation, crossover, and selection of candidate factors. By embedding evolutionary instructions into prompts, the LLM leverages domain knowledge and backtesting feedback to generate interpretable and high-quality signals. We first validate the approach through static factor searching, showing that LLMs can iteratively refine factors in a controlled setting. We then evaluate the framework in sparse portfolio optimization, where LLM-generated factors are used to rank assets and construct portfolios under $\\ell_0$ constraints. Experiments on multiple real-market datasets demonstrate consistent improvements in portfolio performance over traditional baselines, highlighting the promise of combining LLMs with evolutionary search for systematic factor discovery.",
