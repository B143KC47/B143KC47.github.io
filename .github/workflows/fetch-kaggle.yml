name: Fetch Kaggle Profile

on:
  schedule:
    # Daily at 01:30 UTC — offset from the publications job (00:00) so the two
    # auto-commits never race on the same push.
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  fetch-kaggle:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # fflate is needed to unzip leaderboard CSVs for the competition history.
      - name: Install tooling dependencies
        run: npm ci

      # Refreshes the #profiles-data Kaggle card in index.html + data/profiles.json,
      # including the competition history (competitionList) via the official API
      # (api.kaggle.com, Bearer token). Only competitions with >= 1 submission are
      # kept — matching what the Kaggle profile page actually shows. Per-slug curated
      # fields (writeups, overrides) are preserved across refreshes.
      # Non-destructive: on any error or empty response it keeps the existing curated
      # data (and the hand-maintained LeetCode card is never touched).
      - name: Fetch Kaggle profile (non-destructive)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          # Optional legacy fallback pair (kaggle.json) — used only if the token is unset.
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: node scripts/fetch-kaggle.mjs

      - name: Commit and push if changed
        run: |
          git config --local user.email "tiangong1337@outlook.com"
          git config --local user.name "KO Ho Tin"
          # The sync can download official covers or generate local fallbacks.
          # Stage those assets with the JSON that references them so Pages never
          # deploys a new image path without the corresponding file.
          git add index.html data/profiles.json assets/competitions

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Auto-update Kaggle profile data [skip ci]"
            git push
            echo "✅ Kaggle profile data and competition assets updated"
          fi
